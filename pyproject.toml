[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "paged-attention-kernels"
version = "0.1.0"
description = "FlashInfer-style paged KV-cache attention kernels (CUDA, Triton) with a JIT code generator"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]
[project.optional-dependencies]
triton = ["triton>=3.0"]
dev = ["pytest>=8"]
[tool.setuptools.packages.find]
include = ["paged_attention*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
